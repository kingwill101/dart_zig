name: fractal_flutter_example
description: Flutter fractal renderer powered by a dart_zig native worker stream.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  dart_zig:
    path: ../..
  ffi: ^2.2.0
  hooks: ^2.2.0
  logging: ^1.3.0
  native_toolchain_zig:
    git:
      url: https://github.com/kingwill101/native_toolchain_zig.dart.git
      ref: cimport-generator-wip

dev_dependencies:
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
